[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader"
version = "0.1.0"
description = "CLI automated trading platform for Alpaca paper trading, starting with GLD/GDX pair trading"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
exe = ["pyinstaller>=6"]

[project.scripts]
trader = "autotrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
