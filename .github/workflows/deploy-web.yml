name: Deploy web (PWA)

# Builds the web app and publishes it to GitHub Pages, giving OptPoP a public
# HTTPS URL you can open on a phone and "Add to Home Screen" as an installable
# PWA. Runs on every push to main, or manually.
#
# NOTE: GitHub Pages for a PRIVATE repo requires a paid plan (GitHub Pro/Team).
# On a free plan, either make the repo public, or deploy the built `dist/`
# folder to Netlify or Cloudflare Pages instead (both support private repos and
# a free HTTPS domain). The build step below is identical for those hosts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
