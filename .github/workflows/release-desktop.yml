name: Desktop builds

# Builds native installers with Tauri:
#   - Windows .exe / .msi
#   - macOS .app / .dmg (Apple Silicon + Intel)
#   - Linux .AppImage / .deb
# Runs on version tags (v*) or manually from the Actions tab.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple') && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Generate bundle icons
        run: npx tauri icon public/icon-512.png

      - name: Build with Tauri
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On a version tag: publish a draft GitHub Release with the installers.
          # On a manual run (no tag): tagName is empty, so tauri-action skips the
          # release — the upload step below keeps the installers as artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('OptPoP {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}

      # Always make the built installers downloadable from the run's Artifacts,
      # even for manual (workflow_dispatch) builds that create no Release.
      - name: Name the artifact
        id: label
        shell: bash
        run: |
          label="${{ matrix.platform }}"
          case "${{ matrix.args }}" in
            *aarch64-apple*) label="macos-apple-silicon" ;;
            *x86_64-apple*)  label="macos-intel" ;;
            *windows*)       label="windows" ;;
          esac
          [ "${{ matrix.platform }}" = "windows-latest" ] && label="windows"
          [ "${{ matrix.platform }}" = "ubuntu-22.04" ] && label="linux"
          echo "name=optpop-$label" >> "$GITHUB_OUTPUT"

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.label.outputs.name }}
          if-no-files-found: warn
          path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), fromJSON('"\n"')) }}
